# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

# Do not use VSBuild to build the whole solution 
# (Note: VSBuild built /WebApp.zip but now DotNetCoreCLI builds  /publish folder)
# - task: VSBuild@1
#   inputs:
#     solution: '$(solution)'
#     msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:DesktopBuildPackageLocation="$(build.artifactStagingDirectory)\WebApp.zip" /p:DeployIisAppPath="Default Web Site"'
#     platform: '$(buildPlatform)'
#     configuration: '$(buildConfiguration)'

# build just the Mvc.RazorComponents project
- task: DotNetCoreCLI@2
  inputs:
    command: 'publish'
    projects: 'src/Timesheet.Mvc.RazorComponents/Timesheet.Mvc.RazorComponents.csproj'
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/publish'
    zipAfterPublish: true

# publish the artifact
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish.zip'
    ArtifactName: 'drop'
    

# run the unit tests
- task: VSTest@2
  inputs:
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

# deploy to azure 
- task: azureRmWebAppDeployment@4
  inputs:
    appType: 'webApp'
    azureSubscription: 'TimesheetServiceConnection' # N.B. is actually a service connection name not a subscription
    WebAppName: 'TimesheetMvcRazorComponents'
    package: '$(build.artifactStagingDirectory)/publish.zip'
    #package: '$(build.artifactStagingDirectory)/WebApp.zip'  <-- this would be the correct output for VSBuild